attributes:
  ProductID: GAIN
  algorithm_version: null
  date_created: null
  input_files: null
  source_obsids: null
coordinates:
  RAD_FULL_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  RAD_FULL_FPE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - RAD_FULL_FPE_TIME
    attributes:
      long_name: Radiometer full resolution sample timestamp from FPE (samples at 1kHz)
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  CAL_FULL_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - CAL_FULL_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  CAL_FULL_FPE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - CAL_FULL_FPE_TIME
    attributes:
      long_name: Calibration full resolution sample timestamp from FPE (samples at 1kHz)
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  NOM_HK_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - NOM_HK_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
      valid_range:
        - "1900-01-01T00:00:00"
        - "2100-01-01T00:00:00"
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
variables:
  RAD_FULL_PKT_APID:
    dtype: uint16
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: Packet application ID
      valid_range:
        - 0
        - 2047
  RAD_FULL_SRC_SEQ_CTR:
    dtype: uint16
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: Source sequence counter
      valid_range:
        - 0
        - 16383
  RAD_FULL_PKT_LEN:
    dtype: uint16
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: Packet length
      units: bytes
  ICIE__TM_DAY_RAD_FULL:
    dtype: uint16
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: ICIE telemetry day for packet
      units: integer days
  ICIE__TM_MS_RAD_FULL:
    dtype: uint32
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: ICIE telemetry milliseconds for packet
      units: integer milliseconds
      valid_range:
        - 0
        - 86399999
  ICIE__TM_US_RAD_FULL:
    dtype: uint16
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: ICIE telemetry microseconds for packet
      units: integer microseconds
      valid_range:
        - 0
        - 999
  ICIE__RAD_FULL_CHECKSUM:
    dtype: uint32
    dimensions:
      - RAD_FULL_PACKET
    attributes:
      long_name: ICIE radiometer full resolution packet checksum
  ICIE__RAD_FULL_RES_0:
    dtype: float32
    dimensions:
      - RAD_FULL_FPE_TIME
    attributes:
      long_name: ICIE radiometer full resolution channel 0 (SW)
      units: W/(m^2*sr*nm)
  ICIE__RAD_FULL_RES_1:
    dtype: float32
    dimensions:
      - RAD_FULL_FPE_TIME
