  ICIE__RAD_SAMPLE_2:
    dtype: float32
    dimensions:
      - RAD_SAMPLE_FPE_TIME
    attributes:
      long_name: ICIE radiometer sample channel 2 (LW)
      units: W/(m^2*sr*nm)
  ICIE__RAD_SAMPLE_3:
    dtype: float32
    dimensions:
      - RAD_SAMPLE_FPE_TIME
    attributes:
      long_name: ICIE radiometer sample channel 3 (SSW)
      units: W/(m^2*sr*nm)
  RAD_SAMPLE_packet_index:
    dtype: int64
    dimensions:
      - RAD_SAMPLE_FPE_TIME
