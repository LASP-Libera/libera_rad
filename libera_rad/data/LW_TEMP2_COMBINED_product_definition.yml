attributes:
  ProductID: LW-TEMP2-COMBINED
  algorithm_version: null
  date_created: null
  input_files: null
coordinates:
  RAD_SAMPLE_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  RAD_SAMPLE_FPE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - RAD_SAMPLE_FPE_TIME
    attributes:
      long_name: Radiometer sample timestamp from FPE (samples at 200Hz)
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  NOM_HK_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - NOM_HK_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
      valid_range:
        - "1900-01-01T00:00:00"
        - "2100-01-01T00:00:00"
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  PEC_SW_STAT_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - PEC_SW_STAT_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
  PEV_SW_STAT_PACKET_ICIE_TIME:
    dtype: datetime64[ns]
    dimensions:
      - PEV_SW_STAT_PACKET
    attributes:
      long_name: Packet timestamp from ICIE main processor
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64
variables:
  RAD_SAMPLE_PKT_APID:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: Packet application ID
      valid_range:
        - 0
        - 2047
  RAD_SAMPLE_SRC_SEQ_CTR:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: Source sequence counter
      valid_range:
        - 0
        - 16383
  RAD_SAMPLE_PKT_LEN:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: Packet length
      units: bytes
  ICIE__TM_DAY_RAD_SAMPLE:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: ICIE telemetry day for packet
      units: integer days
  ICIE__TM_MS_RAD_SAMPLE:
    dtype: uint32
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: ICIE telemetry milliseconds for packet
      units: integer milliseconds
      valid_range:
        - 0
        - 86399999
  ICIE__TM_US_RAD_SAMPLE:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: ICIE telemetry microseconds for packet
      units: integer microseconds
      valid_range:
        - 0
        - 999
  ICIE__RAD_OBSID_RAD:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: ICIE radiometer observation ID for radiometer
  ICIE__RAD_OBSID_WFOV:
    dtype: uint16
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: ICIE radiometer observation ID for wide field of view camera
  ICIE__RAD_SAMPLE_CHECKSUM:
    dtype: uint32
    dimensions:
      - RAD_SAMPLE_PACKET
    attributes:
      long_name: ICIE radiometer sample packet checksum
  ICIE__RAD_SAMPLE_0:
    dtype: float32
    dimensions:
      - RAD_SAMPLE_FPE_TIME
    attributes:
      long_name: ICIE radiometer sample channel 0 (SW)
      units: W/(m^2*sr*nm)
  ICIE__RAD_SAMPLE_1:
    dtype: float32
    dimensions:
      - RAD_SAMPLE_FPE_TIME
    attributes:
      long_name: ICIE radiometer sample channel 1 (TOT)
