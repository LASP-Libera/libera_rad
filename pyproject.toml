[tool.poetry]
name = "libera_rad"
version = "0.1.0"
description = "Science data processing algorithm for Libera radiometer L1b product"
authors = [
    "Stéphane Béland <stephane.beland@lasp.colorado.edu>",
    "Kim Kokkonen <kim.kokkonen@lasp.colorado.edu>",
    "Gavin Medley <gavin.medley@lasp.colorado.edu>",
    "Laura Sandoval <laura.sandoval@lasp.colorado.edu>",
    "Matt Watwood <matt.watwood@lasp.colorado.edu>",
    "Caleb Kumar <caleb.kumar@colorado.edu>"
]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
cloudpathlib = ">=0.13.0,<1.0.0"
urllib3 = "<2"  # To reduce dependency solving time related to AWS libraries
libera-utils = { version="^2.4.0rc1", allow-prereleases=true }
#libera-utils = { path="../libera_utils", develop=true }
xarray = ">=2023.1.0"
netcdf4 = "^1.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.2"
pytest-randomly = "^3.12.0"
pytest-coverage = "^0.0"
pylint = "^2.14.2"
bandit = "^1.7.4"

[tool.poetry.scripts]
libera-rad = 'libera_rad.cli:main'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
