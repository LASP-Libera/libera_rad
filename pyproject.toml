[project]
name = "libera_rad"
version = "0.7.0"
description = "Science data processing algorithm for Libera radiometer L1b product"
authors = [
    { name = "Stephane Beland" },
    { name = "Heather Cronk" },
    { name = "Caitlin Kessler"},
    { name = "Kim Kokkonen" },
    { name = "Gavin Medley" },
    { name = "Laura Sandoval" },
    { name = "Matt Watwood" },
]
maintainers = [
    { name = "Gavin Medley" },
    { name = "Matt Watwood" },
    { name = "Libera Science Data Center", email = "libera.sdp.support@lists.lasp.colorado.edu" },
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.11,<4"
keywords = [
    "libera",
    "earth science",
    "radiation budget",
    "lasp",
    "university of colorado",
    "bolometer",
    "radiometer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "cloudpathlib[s3]>=0.14.0,<1.0",
    "libera-utils == 5.10.7",
    # Pinned: needs the moon_direction geometry field from curryer #186, which is not
    # released. Pinned to a commit so an upstream push cannot change what CI resolves.
    # Unpin when curryer #186 merges and is released.
    "lasp-curryer @ git+https://github.com/lasp/curryer.git@df5efa34ad0acbf55b9915d514bcffed17bcdf7e",
    "xarray >= 2025.10.1",
    "netcdf4 >=1.7.0,<2.0",
    "pandas >=2.0, <3.0",
    "scipy >= 1.7.0, <2.0",
    "pydantic >2.0.3, <3.0",
    "matplotlib >=3.5.0, <4.0",
    "astropy (>=7.2.0,<8.0.0)",
] # These are the dependencies used in the package metadata when building the project

[project.scripts]
libera-rad = 'libera_rad.cli:main'

[tool.poetry]
packages = [{ include = "libera_rad" }]
include = ["LICENSE.txt", "README.md"]

[tool.poetry.group.dev.dependencies]
bandit = "*"
moto = {extras = ["s3"], version = "*"}
pre-commit = "*"
pytest-cov = "*"
pytest-randomly = "*"
pytest-subprocess = "*"
ruff = "*"

[tool.poetry.group.extras.dependencies]
ipykernel = "^6.4.1"
jupyter = "^1.0.0"

[tool.pytest.ini_options]
markers = [
    "integration: mark a test as an integration test. Skip these tests with `pytest -m 'not integration' tests`",
]
minversion = 6.0
xfail_strict = true

[build-system]
requires = ["poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
extend-include = ["libera_rad/**/*.py", "tests/**/*.py"]
extend-exclude = [
    "tests/test_data/**",
    "libera_rad/data/**",
    "learning_notebooks/**",
    "calibration_tools/**",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort import sorting
    "S",  # flake8-bandit security
    "PT", # flake8-pytest-style
    "UP", # pyupgrade syntax upgrader
]
per-file-ignores = { "tests/*" = ["S"] }
